<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEEPRUN 하강</title>
<style>
@font-face{font-family:'Galmuri';src:url(data:font/woff2;base64,__REG__) format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'Galmuri';src:url(data:font/woff2;base64,__BOLD__) format('woff2');font-weight:700;font-display:block}
/* 8비트 콘솔 팔레트 — 채널을 8단계로 끊어 옛 PPU가 섞던 대로 */
:root{
  --k:#000000; --d:#181830; --g:#484878; --G:#9090c0; --w:#d8d8c0;
  --R:#f84038; --o:#f87c20; --y:#f8d020; --E:#58e068; --B:#48a8f8; --P:#c868f8; --c:#10b8a8;
  --pad:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--k);color:var(--w);
  font-family:'Galmuri',ui-monospace,monospace;font-weight:400;
  -webkit-font-smoothing:none;image-rendering:pixelated;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  display:flex;justify-content:center;align-items:stretch}

/* 세로 한 화면. 데스크톱에서도 폰 폭으로 고정한다 — 이건 폰 게임이다. */
#phone{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;
  background:var(--k);border-left:2px solid var(--d);border-right:2px solid var(--d);
  padding-bottom:var(--pad)}

/* ── 상단 계기 ── */
#top{flex:none;padding:6px 8px 4px;display:flex;flex-direction:column;gap:4px;
  background:var(--d);border-bottom:2px solid var(--k)}
.row{display:flex;align-items:center;gap:6px}
.tag{font-size:9px;color:var(--g);letter-spacing:.14em;flex:none}
#hpbar{flex:1;height:12px;background:var(--k);border:2px solid var(--g);padding:1px;display:flex;gap:1px}
#hpbar i{flex:1;background:var(--E);min-width:1px}
#hpbar i.off{background:#102018}
#hpbar i.hurt{background:var(--R)}
#hptxt,#deptxt{font-size:10px;font-weight:700;color:var(--w);
  font-variant-numeric:tabular-nums;flex:none}
#deptxt{color:var(--y)}

/* ── 지도 ── */
#stage{flex:1;position:relative;overflow:hidden;background:var(--k);min-height:0}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  image-rendering:pixelated}
.pop{position:absolute;font-size:13px;font-weight:700;pointer-events:none;
  text-shadow:2px 2px 0 var(--k);animation:rise .7s steps(7) forwards}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-26px);opacity:0}}
#msg{position:absolute;left:0;right:0;bottom:0;padding:5px 8px;background:#000000cc;
  font-size:10.5px;line-height:1.5;color:var(--G);min-height:22px}
#msg b{color:var(--w);font-weight:700} #msg u{text-decoration:none;color:var(--y)}

/* ── 압력계: 화면의 심장 ── */
#gauge{flex:none;background:var(--d);border-top:2px solid var(--k);
  border-bottom:2px solid var(--k);padding:5px 8px;display:flex;align-items:center;gap:8px}
#gauge.fire{background:#2a1d10}
#pnum{font-size:30px;font-weight:700;color:var(--y);line-height:1;
  font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
#gauge.fire #pnum{color:var(--o)}
#pbar{flex:1;height:14px;background:var(--k);border:2px solid var(--g);padding:1px;
  display:flex;gap:1px;overflow:hidden}
#pbar i{flex:1;background:#102030;min-width:1px}
#pbar i.on{background:var(--o)} #pbar i.hot{background:var(--y)}
#pmul{font-size:15px;font-weight:700;color:var(--P);min-width:4.5ch;text-align:right}

/* ── 체인 ── */
#chainwrap{flex:none;background:var(--k);padding:5px 6px 4px}
.chh{font-size:9px;color:var(--g);letter-spacing:.12em;padding:0 2px 4px;
  display:flex;justify-content:space-between}
#chain{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#chain::-webkit-scrollbar{display:none}
.mod{flex:none;width:96px;min-height:60px;background:var(--d);border:2px solid var(--g);
  padding:4px 5px;text-align:left;font:inherit;color:inherit;position:relative}
.mod .mi{font-size:8.5px;color:var(--g);letter-spacing:.05em}
.mod .mn{font-size:11px;font-weight:700;line-height:1.25;margin:1px 0 2px}
.mod .md{font-size:8.5px;color:var(--G);line-height:1.35}
.mod.gen .mn{color:var(--E)} .mod.mul .mn{color:var(--P)} .mod.gun .mn{color:var(--o)}
.mod.gen{border-color:#2a6840} .mod.mul{border-color:#6a3a88} .mod.gun{border-color:#8a5018}
.mod.sel{border-color:var(--y);background:#2a2418}
.mod.on{border-color:var(--y);background:#3a2c10}

#relics{display:flex;gap:4px;overflow-x:auto;padding:4px 2px 0;scrollbar-width:none}
#relics::-webkit-scrollbar{display:none}
.rel{flex:none;background:#241038;border:2px solid var(--P);padding:2px 5px;
  font-size:8.5px;color:var(--G);line-height:1.35;max-width:132px}
.rel b{display:block;color:var(--P);font-size:10px;font-weight:700}

/* ── 엄지 구역 ── */
#pad{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  padding:5px 6px 6px;background:var(--k)}
#pad button{height:52px;font-size:17px;padding:0}
button{font:inherit;background:var(--d);border:2px solid var(--g);color:var(--w);
  font-weight:700;cursor:pointer;letter-spacing:.05em;font-size:12px;padding:9px 12px}
button:active{background:var(--g)}
button:focus-visible{border-color:var(--y);outline:none}
button:disabled{opacity:.3}

/* ── 시트 ── */
.sheet{position:fixed;inset:0;background:#000000ee;display:none;z-index:9;
  align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sbox{width:100%;max-width:430px;background:var(--d);border-top:3px solid var(--y);
  padding:12px 10px calc(12px + var(--pad))}
.sbox h3{margin:0 0 2px;font-size:12px;color:var(--y);letter-spacing:.1em}
.sbox p{margin:0 0 10px;font-size:9.5px;color:var(--g);line-height:1.6}
.cards{display:flex;flex-direction:column;gap:6px}
.card{background:var(--k);border:2px solid var(--g);padding:9px;text-align:left;width:100%}
.card:active{border-color:var(--y)}
.card .cn{font-size:12px;font-weight:700;color:var(--B);margin-bottom:2px}
.card .cd{font-size:9.5px;color:var(--G);line-height:1.5}
#over .sbox{border-top-color:var(--R)}
#ot{font-size:18px;font-weight:700;margin:0 0 6px}
#op{font-size:10px;color:var(--G);line-height:1.8;margin:0 0 10px}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}}
</style>

<div id="phone">
  <div id="top">
    <div class="row">
      <span class="tag">노심</span>
      <div id="hpbar"></div>
      <span id="hptxt">36/36</span>

</div>

<div class="sheet" id="draft"><div class="sbox">
  <h3 id="dh">부품함</h3><p id="dp"></p><div class="cards" id="cards"></div>
</div></div>
<div class="sheet" id="over"><div class="sbox">
  <h3 id="ot"></h3><p id="op"></p>
  <button style="width:100%;padding:12px" onclick="location.reload()">다시</button>
</div></div>

<script>
const $ = i => document.getElementById(i);
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

/* ═══ 그림 — 파일 없음. 전부 8×8 문자 격자다. ═══ */
const PAL = { '.':null, k:'#000000', d:'#181830', g:'#484878', G:'#9090c0', w:'#d8d8c0',
  W:'#f8f8f8', r:'#a81020', R:'#f84038', o:'#f87c20', y:'#f8d020', n:'#805020', N:'#c89050',
  e:'#089840', E:'#58e068', b:'#2048c8', B:'#48a8f8', p:'#8028a8', P:'#c868f8',
  c:'#10b8a8', s:'#98a0b8', S:'#d0d8e8' };

const ART = {
  /* 주인공 — 강화복을 입은 인간 */
  hero:['..ssss..','.sBBBBs.','.SkSSkS.','..ssss..','.oSSSSo.','sSS..SSs','.S....S.','.s....s.'],
  /* 배선 게 — 평범하게 기어온다 */
  crawler:['........','.R....R.','..RrrR..','.RrRRrR.','RrRkkRrR','.RrRRrR.','..r..r..','.r....r.'],
  /* 장갑 보행기 — 두껍다 */
  plate:['.ssssss.','.sSSSSs.','.sRkkRs.','.sSSSSs.','ssssssss','.s.ss.s.','.s.ss.s.','ss....ss'],
  /* 나노 군체 — 흩어져 있다 */
  swarm:['.P..P...','..PP..P.','P..PP...','..P..PP.','.PP...P.','P...PP..','..PP..P.','.P...P..'],
  /* 흡열 드론 — 빤다 */
  siphon:['..cccc..','.cyyyyc.','.cyRRyc.','.cyyyyc.','..cccc..','.c.cc.c.','c......c','.c....c.'],
  /* 지형 */
  wall:['GGGGGGGG','GggggggG','gggggggg','gggkgggg','gggggggg','ggggggkg','gggggggg','kkkkkkkk'],
  floor:['dddddddd','dddddddd','ddddgddd','dddddddd','dddddddd','dgdddddd','dddddddd','ddddddkd'],
  cache:['........','.BBBBBB.','.BddddB.','.BdyydB.','.BdyydB.','.BddddB.','.BBBBBB.','..bbbb..'],
  forge:['........','...oo...','..oyyo..','.oyWWyo.','.oyyyyo.','..oooo..','.gggggg.','.gggggg.'],
  stair:['........','.EEEEEE.','.e....e.','.eEEEEe.','..e..e..','..eEEe..','...ee...','........'],
};
const S = 3;                                   // 픽셀 배율 — 정수만
const TILE = 8 * S;
const baked = {};
function bake(){
  for (const [k, grid] of Object.entries(ART)){
    const c = document.createElement('canvas'); c.width = c.height = 8*S;
    const x = c.getContext('2d');
    grid.forEach((row,y)=>[...row].forEach((ch,px)=>{
      const col = PAL[ch]; if(!col) return;
      x.fillStyle = col; x.fillRect(px*S, y*S, S, S);
    }));
    baked[k] = c;
  }
}

/* ═══ 규칙층 — DOM을 모른다. 벤치가 같은 코드를 돌린다. ═══ */
const MODS = {
  boiler:{id:'boiler',n:'증기 보일러',k:'gen',t:'발생',d:'압력 +12'},
  scrap: {id:'scrap', n:'고철 연소', k:'gen',t:'발생',d:'교전 중 적 하나마다 +5'},
  bleed: {id:'bleed', n:'배압 회수', k:'gen',t:'발생',d:'잃은 노심 1당 +1'},
  spark: {id:'spark', n:'점화 플러그',k:'gen',t:'발생',d:'압력 +4 · 다음 증폭 +0.4'},
  amp:   {id:'amp',   n:'증폭 코일', k:'mul',t:'증폭',d:'압력 ×1.6'},
  over:  {id:'over',  n:'과열 밸브', k:'mul',t:'증폭',d:'×2.2 · 노심 −3'},
  echo:  {id:'echo',  n:'되울림',   k:'mul',t:'증폭',d:'앞 모듈이 한 번 더'},
  cast:  {id:'cast',  n:'산탄 방출', k:'gun',t:'방출',d:'압력 55%를 전원'},
  lance: {id:'lance', n:'관통 사출', k:'gun',t:'방출',d:'압력 전부를 맨 앞'},
  arc:   {id:'arc',   n:'감전 아크', k:'gun',t:'방출',d:'압력 40%를 앞 둘'},
  vent:  {id:'vent',  n:'냉각 배출', k:'gun',t:'방출',d:'압력 25% 전원 · 노심 +5'},
};
const POOL = Object.values(MODS);
const RELICS = {
  twin: {id:'twin', n:'쌍둥이 축', d:'마지막 증폭이 한 번 더'},
  siege:{id:'siege',n:'공성 탄두', d:'첫 방출은 장갑 무시'},
  hoard:{id:'hoard',n:'축압기',   d:'교전 뒤 압력 40% 잔류'},
  plate:{id:'plate',n:'덧댄 장갑', d:'적의 타격 −2'},
};
const FOES = {
  crawler:{k:'crawler',n:'배선 게',   hp:11,dmg:4,r:'평범하다'},
  plate:  {k:'plate',  n:'장갑 보행기',hp:30,dmg:7,r:'받는 피해 −5',armor:5},
  swarm:  {k:'swarm',  n:'나노 군체', hp:10,dmg:4,r:'두 칸씩',fast:true},
  siphon: {k:'siphon', n:'흡열 드론', hp:18,dmg:5,r:'첫 증폭을 무효로',jam:true},
};

const W = 31, H = 23;
const IDX = (x,y) => y*W + x;

function makeFloor(depth){
  const t = new Array(W*H).fill('#'), rooms = [];
  for (let i=0;i<7+depth;i++){
    const rw = 4+rnd(5), rh = 3+rnd(4);
    const rx = 1+rnd(W-rw-2), ry = 1+rnd(H-rh-2);
    rooms.push([rx,ry,rw,rh]);
    for (let y=ry;y<ry+rh;y++) for (let x=rx;x<rx+rw;x++) t[IDX(x,y)]='.';
  }
  const cx = r => [r[0]+(r[2]>>1), r[1]+(r[3]>>1)];
  for (let i=1;i<rooms.length;i++){
    const [ax,ay]=cx(rooms[i-1]), [bx,by]=cx(rooms[i]);
    for (let x=Math.min(ax,bx);x<=Math.max(ax,bx);x++) t[IDX(x,ay)]='.';
    for (let y=Math.min(ay,by);y<=Math.max(ay,by);y++) t[IDX(bx,y)]='.';
  }
  return {t, rooms, cx};
}
function newRun(){
  return { depth:1, hp:36, mhp:36, kills:0, p:0, pmax:60,
    chain:[MODS.boiler, MODS.amp, MODS.cast], relics:[] };
}
function enterDepth(G){
  const F = makeFloor(G.depth);
  G.t = F.t; G.seen = new Array(W*H).fill(false); G.mem = new Array(W*H).fill(false);
  const [sx,sy] = F.cx(F.rooms[0]); G.x = sx; G.y = sy;
  G.t[IDX(...F.cx(F.rooms[F.rooms.length-1]))] = '>';
  const spots = []; for (let i=1;i<F.rooms.length-1;i++) spots.push(F.cx(F.rooms[i]));
  for (let i=0;i<Math.min(2,spots.length);i++) G.t[IDX(...spots[i])]='◆';
  if (spots.length>2) G.t[IDX(...spots[2])]='▲';
  G.foes = [];
  const kinds = G.depth===1 ? ['crawler','crawler','swarm']
              : G.depth===2 ? ['crawler','swarm','plate','siphon']
              : ['plate','siphon','swarm','plate','crawler'];
  for (let i=0;i<6+G.depth*2;i++){
    let x,y,tr=0;
    do { x=rnd(W); y=rnd(H); tr++; } while (tr<200 &&
      (G.t[IDX(x,y)]==='#' || (Math.abs(x-sx)<5 && Math.abs(y-sy)<5) || foeAt(G,x,y)));
    if (G.t[IDX(x,y)]==='#') continue;
    const F0 = FOES[kinds[i % kinds.length]];
    G.foes.push({...F0, x, y, maxhp:F0.hp, hp:F0.hp});
  }
  see(G);
}
const foeAt = (G,x,y) => G.foes.find(f=>f.hp>0 && f.x===x && f.y===y);
const walkable = (G,x,y) => x>=0&&y>=0&&x<W&&y<H&&G.t[IDX(x,y)]!=='#';
function see(G){
  const R = 5;
  for (let y=G.y-R;y<=G.y+R;y++) for (let x=G.x-R;x<=G.x+R;x++){
    if (x<0||y<0||x>=W||y>=H) continue;
    if ((x-G.x)**2+(y-G.y)**2 > R*R+2) continue;
    G.seen[IDX(x,y)]=true; G.mem[IDX(x,y)]=true;
  }
}
/* 옆에 붙은 것은 전부 함께 나온다 — 위치가 곧 교전 규모 */
function engaged(G, target){
  const set = target ? [target] : [];
  for (const f of G.foes){
    if (f.hp<=0 || set.includes(f)) continue;
    if (Math.abs(f.x-G.x)<=1 && Math.abs(f.y-G.y)<=1) set.push(f);
  }
  return set;
}
function resolveChain(G, foes, sink){
  const say = (t,kind,who) => sink && sink(t,kind,who);
  const alive = () => foes.filter(f=>f.hp>0);
  const has = id => G.relics.some(r=>r.id===id);
  let bonus = 0, gunNo = 0, total = 0;
  let jam = alive().filter(f=>f.jam).length;    // 흡열 드론이 증폭을 씹는다
  let lastMul = -1;
  for (let i=0;i<G.chain.length;i++) if (G.chain[i].k==='mul') lastMul = i;

  const run = (m,i,dep) => {
    if (dep>3) return;
    if (m.k==='gen'){
      let add = 0;
      if (m.id==='boiler') add = 12;
      if (m.id==='scrap')  add = alive().length*5;
      if (m.id==='bleed')  add = G.mhp-G.hp;
      if (m.id==='spark'){ add = 4; bonus += .4; }
      G.p += add; say(`+${add}`,'gen');
    } else if (m.k==='mul'){
      if (m.id==='echo'){
        const prev = G.chain[i-1];
        if (prev){ say('되울림','mul'); run(prev,i-1,dep+1); } else say('빈 되울림','bad');
        return;
      }
      const base = m.id==='over' ? 2.2 : 1.6;
      if (jam > 0){ jam--; say('증폭이 씹혔다','bad'); return; }
      const mult = base + bonus; bonus = 0;
      G.p = Math.round(G.p*mult*10)/10;
      if (m.id==='over') G.hp -= 3;
      say(`×${mult.toFixed(1)}`,'mul');
      if (has('twin') && i===lastMul && dep===0){
        G.p = Math.round(G.p*base*10)/10; say(`쌍둥이 ×${base}`,'mul');
      }
    } else {
      const A = alive();
      if (!A.length){ say('겨눌 것 없음','bad'); return; }
      gunNo++;
      const pierce = has('siege') && gunNo===1;
      let hits = [];
      if (m.id==='cast')  hits = A.map(f=>[f, G.p*.55]);
      if (m.id==='lance') hits = [[A[0], G.p]];
      if (m.id==='arc')   hits = A.slice(0,2).map(f=>[f, G.p*.40]);
      if (m.id==='vent'){ hits = A.map(f=>[f, G.p*.25]); G.hp = Math.min(G.mhp, G.hp+5); }
      let sum = 0;
      for (const [f,raw] of hits){
        const d = Math.max(1, Math.round(raw) - (pierce?0:(f.armor||0)));
        f.hp -= d; sum += d; if (f.hp<=0){ f.hp=0; G.kills++; }
        say(`−${d}`,'hit',f);
      }
      total += sum; G.p = 0;
    }
  };
  for (let i=0;i<G.chain.length;i++){
    run(G.chain[i], i, 0);
    if (G.hp<=0) break;
    if (sink) sink('@step:'+i);
  }
  G.p = has('hoard') ? Math.round(G.p*.4) : 0;
  return total;
}
function retaliate(G, foes){
  const has = id => G.relics.some(r=>r.id===id);
  return foes.filter(f=>f.hp>0)
    .reduce((s,f)=> s + Math.max(1, f.dmg - (has('plate')?2:0)), 0);
}

/* ═══ 화면층 ═══ */
let G = null, busy = false, selI = null, dragI = null;
const cv = $('cv'), cx = cv.getContext('2d');
let VW = 13, VH = 11;

function fitCanvas(){
  const st = $('stage');
  VW = Math.max(9, Math.min(W, Math.floor(st.clientWidth / TILE)));
  VH = Math.max(7, Math.min(H, Math.floor((st.clientHeight-4) / TILE)));
  cv.width = VW*TILE; cv.height = VH*TILE;
  cv.style.width = cv.width+'px'; cv.style.height = cv.height+'px';
  cx.imageSmoothingEnabled = false;
  if (G) draw();
}
addEventListener('resize', fitCanvas);
new ResizeObserver(() => fitCanvas()).observe($('stage'));

function draw(){
  const camx = Math.max(0, Math.min(W-VW, G.x - (VW>>1)));
  const camy = Math.max(0, Math.min(H-VH, G.y - (VH>>1)));
  cx.fillStyle = '#000'; cx.fillRect(0,0,cv.width,cv.height);
  for (let vy=0; vy<VH; vy++) for (let vx=0; vx<VW; vx++){
    const x = camx+vx, y = camy+vy;
    if (x<0||y<0||x>=W||y>=H) continue;
    const i = IDX(x,y);
    if (!G.mem[i]) continue;
    const t = G.t[i];
    const key = t==='#' ? 'wall' : t==='>' ? 'stair' : t==='◆' ? 'cache' : t==='▲' ? 'forge' : 'floor';
    if (t !== '#' && t !== '.') cx.drawImage(baked.floor, vx*TILE, vy*TILE);
    cx.drawImage(baked[key], vx*TILE, vy*TILE);
    if (G.seen[i]){
      const f = foeAt(G,x,y);
      if (f) cx.drawImage(baked[f.k], vx*TILE, vy*TILE);
    }
    if (!G.seen[i]){ cx.fillStyle = '#000000a8'; cx.fillRect(vx*TILE, vy*TILE, TILE, TILE); }
  }
  cx.drawImage(baked.hero, (G.x-camx)*TILE, (G.y-camy)*TILE);
  cv.__cam = [camx, camy];
}

function popAt(x, y, text, col){
  const [camx,camy] = cv.__cam || [0,0];
  const el = document.createElement('div');
  el.className = 'pop'; el.textContent = text; el.style.color = col;
  const r = cv.getBoundingClientRect(), s = $('stage').getBoundingClientRect();
  el.style.left = (r.left - s.left + (x-camx)*TILE) + 'px';
  el.style.top  = (r.top  - s.top  + (y-camy)*TILE - 6) + 'px';
  $('stage').appendChild(el);
  setTimeout(()=>el.remove(), 800);
}
function say(html){ $('msg').innerHTML = html; }

const SEG = 20;
function paintBars(){
  const hb = $('hpbar');
  if (hb.children.length !== SEG) hb.innerHTML = '<i></i>'.repeat(SEG);
  const n = Math.ceil(Math.max(0,G.hp)/G.mhp*SEG);
  [...hb.children].forEach((el,i)=>{
    el.className = i<n ? (G.hp/G.mhp<=.34 ? 'hurt' : '') : 'off'; });
  $('hptxt').textContent = `${Math.max(0,G.hp)}/${G.mhp}`;
  $('deptxt').textContent = `구역 ${G.depth}`;

  const pb = $('pbar');
  if (pb.children.length !== SEG) pb.innerHTML = '<i></i>'.repeat(SEG);
  const pn = Math.min(SEG, Math.ceil(G.p/G.pmax*SEG));
  [...pb.children].forEach((el,i)=>{ el.className = i<pn ? (i>SEG*.75?'hot':'on') : ''; });
  $('pnum').textContent = Math.round(G.p);
}
function render(){
  paintBars(); draw();
  $('chain').innerHTML = G.chain.map((m,i)=>`
    <button class="mod ${m.k} ${selI===i?'sel':''}" draggable="true" data-i="${i}">
      <div class="mi">${i+1} · ${m.t}</div><div class="mn">${m.n}</div>
      <div class="md">${m.d}</div></button>`).join('');
  $('relics').innerHTML = G.relics.map(r=>`<div class="rel"><b>${r.n}</b>${r.d}</div>`).join('');
  wireChain();
}

/* ── 한 걸음 ── */
async function step(dx, dy){
  if (busy || G.hp<=0) return;
  const nx = G.x+dx, ny = G.y+dy;
  if (dx||dy){
    const f = foeAt(G,nx,ny);
    if (f) return bump(f);
    if (!walkable(G,nx,ny)) return;
    G.x = nx; G.y = ny;
  }
  see(G);
  const t = G.t[IDX(G.x,G.y)];
  if (t === '>') return descend();
  if (t === '◆'){ G.t[IDX(G.x,G.y)]='.'; say('<u>부품함</u>을 열었다.'); render(); return draft(); }
  if (t === '▲'){ G.t[IDX(G.x,G.y)]='.';
    const h = Math.min(12, G.mhp-G.hp); G.hp += h; G.mhp += 4;
    popAt(G.x,G.y,`+${h}`,'#58e068'); say(`<u>화로</u> — 노심 +${h}, 최대 +4.`); }
  foeTurn(); render();
}
function foeTurn(){
  for (const f of G.foes){
    if (f.hp<=0) continue;
    const dist = Math.max(Math.abs(f.x-G.x), Math.abs(f.y-G.y));
    if (dist>7 || dist<=1) continue;
    for (let s=0; s<(f.fast?2:1); s++){
      const dx = Math.sign(G.x-f.x), dy = Math.sign(G.y-f.y);
      for (const [ax,ay] of [[dx,dy],[dx,0],[0,dy]]){
        if (!ax && !ay) continue;
        const tx=f.x+ax, ty=f.y+ay;
        if (!walkable(G,tx,ty) || foeAt(G,tx,ty) || (tx===G.x&&ty===G.y)) continue;
        f.x=tx; f.y=ty; break;
      }
    }
  }
}

async function bump(target){
  busy = true;
  const foes = engaged(G, target);
  say(`<b>${foes.length}체</b>와 맞물렸다.`);
  $('gauge').classList.add('fire');

  const ev = [];
  resolveChain(G, foes, (t,kind,who)=>{
    if (typeof t === 'string' && t.startsWith('@step:')) ev.push(['step', +t.slice(6)]);
    else ev.push(['say', t, kind, G.p, who ? {x:who.x, y:who.y} : null]);
  });
  const finalP = G.p, finalHp = G.hp;
  G.p = 0;
  for (const e of ev){
    if (e[0]==='step'){ markOn(e[1], true); await sleep(60); markOn(e[1], false); continue; }
    const [,t,kind,p,at] = e;
    G.p = p; paintBars();
    if (kind==='mul'){ $('pmul').textContent = t; setTimeout(()=>$('pmul').textContent='', 500); }
    if (kind==='hit' && at) popAt(at.x, at.y, t, '#f8d020');
    if (kind==='bad') popAt(G.x, G.y, t, '#48a8f8');
    draw();
    await sleep(kind==='hit' ? 130 : 210);
  }
  $('gauge').classList.remove('fire');
  G.p = finalP; G.hp = finalHp;

  const left = foes.filter(f=>f.hp>0);
  if (left.length){
    const d = retaliate(G, foes); G.hp -= d;
    popAt(G.x, G.y, `−${d}`, '#f84038');
    say(`<b>${left.length}체</b>가 버텼다 — 노심 <b>−${d}</b>.`);
  } else say(`<b>${foes.length}체</b>를 한 번에 정지시켰다.`);
  G.foes = G.foes.filter(f=>f.hp>0);
  foeTurn(); busy = false; render();
  if (G.hp<=0) end(false);
}
function markOn(i,on){ const el = $('chain').children[i]; if (el) el.classList.toggle('on', on); }

function descend(){
  G.depth++;
  if (G.depth>3) return end(true);
  enterDepth(G); render();
  say(`<u>구역 ${G.depth}</u>. 더 깊다.`);
  relicDraft();
}

/* ── 뽑기 ── */
function offer(title, note, list, take){
  $('dh').textContent = title; $('dp').textContent = note;
  $('cards').innerHTML = list.map((m,i)=>`
    <button class="card" data-i="${i}">
      <div class="cn">${m.n}${m.t?` <span style="color:var(--g);font-size:9px">· ${m.t}</span>`:''}</div>
      <div class="cd">${m.d}</div></button>`).join('');
  [...$('cards').children].forEach((b,i)=> b.onclick = ()=>{
    take(list[i]); $('draft').classList.remove('on'); busy=false; render(); });
  busy = true; $('draft').classList.add('on');
}
function draft(){
  const have = new Set(G.chain.map(m=>m.id));
  const pool = POOL.filter(m=>!have.has(m.id));
  const three = [];
  while (three.length < Math.min(3,pool.length)){ const m=pick(pool); if(!three.includes(m)) three.push(m); }
  if (!three.length) return;
  offer('부품함', '하나만 접합됩니다. 자리는 접합한 뒤 탭·탭으로 옮깁니다.',
    three, m => { G.chain.push(m); say(`<u>${m.n}</u>을 체인 끝에 접합했다.`); });
}
function relicDraft(){
  const have = new Set(G.relics.map(r=>r.id));
  const pool = Object.values(RELICS).filter(r=>!have.has(r.id));
  if (!pool.length) return;
  const two = [];
  while (two.length < Math.min(2,pool.length)){ const r=pick(pool); if(!two.includes(r)) two.push(r); }
  offer('하강 보상 — 유물', '유물은 체인의 규칙 자체를 바꿉니다.',
    two, r => { G.relics.push(r); say(`유물 <u>${r.n}</u>.`); });
}

/* ── 순서 바꾸기 ── */
function wireChain(){
  [...$('chain').children].forEach(el=>{
    el.addEventListener('dragstart', ()=>{ dragI = +el.dataset.i; el.style.opacity='.4'; });
    el.addEventListener('dragend',   ()=>{ el.style.opacity=''; });
    el.addEventListener('dragover',  e=>e.preventDefault());
    el.addEventListener('drop', e=>{ e.preventDefault();
      const to = +el.dataset.i; if (dragI===null||dragI===to) return;
      move(dragI,to); dragI=null; selI=null; render(); });
    el.addEventListener('click', ()=>{
      if (busy) return;
      const i = +el.dataset.i;
      if (selI===null) selI = i;
      else if (selI===i) selI = null;
      else { move(selI,i); selI = null; }
      render();
    });
  });
}
function move(from,to){ const [m]=G.chain.splice(from,1); G.chain.splice(to,0,m); }

function end(win){
  busy = true;
  $('ot').textContent = win ? '지표로 올라왔다' : '노심 정지';
  $('ot').style.color = win ? 'var(--E)' : 'var(--R)';
  $('op').innerHTML = win
    ? `구역 셋 돌파 · 모듈 ${G.chain.length} · 유물 ${G.relics.length} · 정지시킨 것 ${G.kills}`
    : `구역 ${G.depth}에서 노심이 꺼졌습니다.<br>같은 모듈이라도 <b>순서</b>가 다르면 결과가 다릅니다 —
       발생으로 모으고, 증폭으로 부풀리고, 마지막에 방출하십시오.`;
  $('over').classList.add('on');
}

/* ── 입력 ── */
const KEYS = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
  w:[0,-1], s:[0,1], a:[-1,0], d:[1,0], '.':[0,0] };
addEventListener('keydown', e=>{
  const k = KEYS[e.key] || KEYS[e.key.toLowerCase?.()];
  if (!k) return; e.preventDefault(); step(k[0],k[1]);
});
$('pad').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  const [dx,dy] = b.dataset.d.split(',').map(Number); step(dx,dy);
});
/* 지도를 탭하면 그 방향으로 한 걸음 — 엄지 하나로도 걷는다 */
cv.addEventListener('click', e=>{
  const r = cv.getBoundingClientRect(), [camx,camy] = cv.__cam || [0,0];
  const tx = Math.floor((e.clientX-r.left)/TILE)+camx, ty = Math.floor((e.clientY-r.top)/TILE)+camy;
  const dx = Math.sign(tx-G.x), dy = Math.sign(ty-G.y);
  if (dx||dy) step(dx,dy);
});

bake();
G = newRun(); enterDepth(G); fitCanvas(); render();
requestAnimationFrame(fitCanvas);
document.fonts?.ready.then(fitCanvas);
say('구역 1. <u>◆</u>부품 · <u>▲</u>화로 · <u>초록 계단</u>은 아래로.');

/* ── 벤치 창구 ── */
window.__step = step;
window.__peek = () => ({ x:G.x, y:G.y, hp:G.hp, depth:G.depth, kills:G.kills,
  chain:G.chain.length, chainIds:G.chain.map(m=>m.id),
  revealed:G.mem.filter(Boolean).length, foes:G.foes.filter(f=>f.hp>0).length,
  draftOpen:$('draft').classList.contains('on'), over:$('over').classList.contains('on') });

/* ── 순서가 결과를 바꾸는가. 화면 없이 규칙만 돌린다. ── */
window.__bench = function(trials){
  const perms = a => a.length<=1 ? [a] :
    a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
  const kit = ['boiler','spark','amp','over','cast'].map(id=>MODS[id]);
  const out = {};
  for (const P of perms(kit)){
    let sum = 0;
    for (let t=0;t<trials;t++){
      const g = { hp:36, mhp:36, p:0, kills:0, chain:P, relics:[] };
      const foes = [ {...FOES.crawler,maxhp:11}, {...FOES.plate,maxhp:30}, {...FOES.swarm,maxhp:10} ];
      sum += resolveChain(g, foes, null);
    }
    out[P.map(m=>m.n).join(' → ')] = Math.round(sum/trials*10)/10;
  }
  const rows = Object.entries(out).sort((a,b)=>b[1]-a[1]);
  return { best:rows[0], worst:rows[rows.length-1], spread:rows[0][1]-rows[rows.length-1][1],
           n:rows.length, top:rows.slice(0,5), bottom:rows.slice(-3) };
};
</script>
